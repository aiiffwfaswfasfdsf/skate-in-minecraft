; Skate in GTA - settings
; Put this file next to SkateInGTA.dll in your "scripts" folder.
; Change a value, save, and reload scripts (default key: Insert) or restart the game.

[Controls]
; Key to get on / off the board. K is free on foot in GTA V (F5-F8 switch characters!).
; Names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
ToggleKey=K

[Board]
; Prop models to try, in order. The first one that exists in the game is used.
Models=v_res_skateboard,v_16_skateboard
; Invisible helper prop that carries the player.
AnchorModel=prop_golf_ball
; Board height above the ground (meters).
Height=0.05
; Rotate the board model if it points sideways (degrees).
YawOffset=90

[Rider]
; Looping animation while riding. Leave AnimDict empty to disable.
AnimDict=move_strafe@stealth
AnimClip=idle
; How high the player stands above the ground (meters).
Height=1.1
; -90 = regular (left foot forward), 90 = goofy, 0 = facing forward.
StanceYaw=-90

[Physics]
; All speeds are in meters per second (1 m/s = 3.6 km/h).
PushAccel=4.0
PushMaxSpeed=9.0
MaxSpeed=22.0
BrakeDecel=7.0
; Fraction of speed lost per second while rolling.
Friction=0.08
; How strongly hills speed you up or slow you down.
SlopeFactor=1.0
; Degrees per second at full steer.
TurnRate=110
Gravity=9.81
; Jump speed for a quick tap / a fully charged ollie.
OllieMin=2.8
OllieMax=5.0
; Hit a wall faster than this and you bail.
BailSpeed=8.0
; Fall faster than this and you bail on landing.
MaxLandingSpeed=15.0

[Tricks]
; Spins must land within this many degrees of straight or backwards (fakie).
LandTolerance=35
; Seconds one flip trick takes. Smaller = easier to land.
TrickDuration=0.45
; Degrees per second of body spin in the air.
AirSpinRate=420
; When you let go of A/D in the air, the spin finishes to the nearest 0/180/360 at this speed.
; Makes spins easy on a keyboard. 0 = off (harder, more "realistic").
SpinAssist=260

[FlickIt]
; Skate-style tricks by flicking a stick: pull DOWN, then flick (see README).
Enabled=true
; Arrow keys act as the stick (best for keyboard players).
ArrowKeys=true
; The mouse acts as the stick: pull the mouse toward you, then flick it away.
Mouse=true
; Raise if mouse flicks don't register, lower if tricks happen by accident.
MouseSensitivity=0.5
; How fast the mouse stick springs back to the middle.
MouseReturn=8
InvertMouseY=false
; Small stick display in the bottom right corner (yellow dot = crouching, ready to flick).
ShowStick=true

[Camera]
; true = Skate-style camera behind the board. false = normal GTA camera.
; Note: while riding, the mouse / right stick are used for flicks, not for turning the camera.
UseSkateCam=true
Distance=4.0
Height=1.6
