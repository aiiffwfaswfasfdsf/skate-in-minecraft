; Skate in GTA - settings
; Put this file next to SkateInGTA.dll in your "scripts" folder.
; Change a value, save, and reload scripts (default key: Insert) or restart the game.

[Controls]
; Key to get on / off the board. K is free on foot in GTA V (F5-F8 switch characters!).
; Names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
ToggleKey=K
; Save a skate spot / teleport back to it (works after a bail too).
MarkerSetKey=J
MarkerReturnKey=U
; Spawn the next skatepark ramp in front of you / remove all spawned ramps.
RampKey=L
ClearRampsKey=Delete
; Bail on purpose (for the Hall of Meat), slow motion on/off, cycle camera (skate / filmer fisheye / far).
BailKey=X
SlowMoKey=B
CameraKey=V
; Show / hide all controls on screen.
HelpKey=H

[Board]
; Prop models to try, in order. The first one that exists in the game is used.
Models=v_res_skateboard,v_16_skateboard
; Invisible helper prop that carries the player.
AnchorModel=prop_golf_ball
; Board height above the ground (meters).
Height=0.05
; Rotate the board model if it points sideways (degrees).
YawOffset=90

[Rider]
; Looping animation while riding. Leave AnimDict empty to disable.
AnimDict=move_strafe@stealth
AnimClip=idle
; How high the player stands above the ground (meters).
Height=1.1
; -90 = regular (left foot forward), 90 = goofy, 0 = facing forward.
StanceYaw=-90

[Physics]
; All speeds are in meters per second (1 m/s = 3.6 km/h).
PushAccel=4.0
PushMaxSpeed=9.0
MaxSpeed=22.0
BrakeDecel=7.0
; Fraction of speed lost per second while rolling.
Friction=0.08
; How strongly hills speed you up or slow you down.
SlopeFactor=1.0
; Degrees per second at full steer.
TurnRate=110
Gravity=9.81
; Jump speed for a quick tap / a fully charged ollie.
OllieMin=2.8
OllieMax=5.0
; Hit a wall faster than this and you bail.
BailSpeed=8.0
; Fall faster than this and you bail on landing.
MaxLandingSpeed=15.0

[Tricks]
; Spins must land within this many degrees of straight or backwards (fakie).
LandTolerance=35
; Seconds one flip trick takes. Smaller = easier to land.
TrickDuration=0.45
; Degrees per second of body spin in the air.
AirSpinRate=420
; When you let go of A/D within 30 degrees of a clean 180/360, the spin finishes itself at this speed.
; You still have to commit to most of the spin. 0 = off (harder).
SpinAssist=260

[FlickIt]
; Skate-style tricks by flicking a stick: pull DOWN, then flick (see README).
Enabled=true
; Arrow keys act as the stick (best for keyboard players).
ArrowKeys=true
; The mouse acts as the stick while you HOLD THE LEFT MOUSE BUTTON (like skate.'s mouse controls):
; hold LMB, pull the mouse toward you, then flick it away.
Mouse=true
; Raise if mouse flicks don't register, lower if the stick moves too far.
MouseSensitivity=0.5
InvertMouseY=false
; Small stick display in the bottom right corner (yellow dot = crouching, ready to flick).
ShowStick=true

[Rocket]
; Scramjet-style rocket: hold SHIFT to boost, SHIFT + ollie = rocket jump.
Enabled=true
; Forward thrust (m/s^2) and top speed while boosting (m/s; 38 m/s = 137 km/h).
Thrust=16
MaxSpeed=38
; Upward thrust while boosting in the air. Higher = longer glides.
AirLift=6
; Extra jump speed for a rocket jump, and how much fuel it costs (1 = full bar).
JumpBoost=8
JumpCost=0.35
; Fuel: full bar lasts 1 / DrainPerSecond seconds. Recharges after RechargeDelay seconds.
DrainPerSecond=0.33
RechargePerSecond=0.2
RechargeDelay=1
; Rocket flames (Rocket Voltic effect). Turn them if they point the wrong way (degrees).
FlameScale=0.6
FlamePitch=0
FlameYaw=0

[Manual]
; Hold CTRL to manual. Points per second while balancing.
PointsPerSecond=60
; Higher = harder to keep your balance.
Difficulty=1.0

[Ramps]
; GTA's own skatepark props. L cycles through them in this order.
Models=prop_skate_kickers,prop_skate_flatramp,prop_skate_funbox,prop_skate_quartpipe,prop_skate_halfpipe,prop_skate_rail,prop_skate_spiner
; How many can exist at once (oldest is removed first).
Max=8
; Spawn distance in front of you (meters).
Distance=8
; Turn the ramps if they face the wrong way (degrees, try 180).
YawOffset=0

[Sound]
; Board sounds come from scripts\SkateInGTA\*.wav. Volume 0.0 - 1.0.
Enabled=true
Volume=0.7

[Camera]
; true = Skate-style camera behind the board. false = normal GTA camera.
; Note: while riding, the mouse / right stick are used for flicks, not for turning the camera.
UseSkateCam=true
Distance=4.0
Height=1.6
