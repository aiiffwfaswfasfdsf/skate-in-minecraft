name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a release for (e.g. v0.1.0). Leave empty to only build.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/SkateInGTA.csproj -c Release

      - name: Package
        run: |
          mkdir -p package/scripts
          cp src/bin/Release/net48/SkateInGTA.dll package/scripts/
          cp SkateInGTA.ini package/scripts/
          cp README.md LICENSE package/
          cd package && zip -r ../SkateInGTA.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: SkateInGTA
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: SkateInGTA.zip
          generate_release_notes: true
